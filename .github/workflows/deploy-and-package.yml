name: TecX AI Autonomous Build, Package & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Blueprint
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Verify Dependencies
        run: npm install

      - name: Package MCP Connectors Release ZIP
        run: |
          mkdir -p dist
          if [ -d "mcp-servers" ] && [ "$(ls -A mcp-servers)" ]; then
            zip -r dist/tecx-ai-mcp-bundle-latest.zip mcp-servers/ package.json
          fi

      - name: Publish Automated GitHub Release
        if: hashFiles('dist/tecx-ai-mcp-bundle-latest.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TecX AI MCP Bundle v1.0.${{ github.run_number }}"
          body: "Automated release generated by TecX AI CI/CD pipeline."
          files: dist/tecx-ai-mcp-bundle-latest.zip

  deploy-storefront:
    needs: verify-and-package
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout Master Blueprint
        uses: actions/checkout@v4

      - name: Deploy Storefront to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./storefront
          vercel-args: "--prod"
          
